name: Release AetherFlow

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm install

      - name: Build frontend bundle
        run: npm run build

      - name: Compile standalone AetherFlow.exe
        working-directory: ./src-tauri
        run: cargo build --release --bin aetherflow

      - name: Build NSIS Installer with Tauri CLI
        run: npm run tauri:build

      - name: Prepare Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-artifacts" -Force
          Copy-Item -Path "src-tauri\target\release\aetherflow.exe" -Destination "release-artifacts\AetherFlow.exe" -Force
          $nsis = Get-ChildItem -Path "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($nsis) {
            Copy-Item -Path $nsis.FullName -Destination "release-artifacts\AetherFlow-Setup.exe" -Force
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
